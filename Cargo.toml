[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
aes = "0.8"
argon2 = { version = "0.5", features = ["zeroize"] }
async-trait = "0.1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
dirs = "6"
dnt-core = { path = "crates/core" }
dnt-driver-mysql = { path = "crates/driver-mysql" }
dnt-driver-pg = { path = "crates/driver-pg" }
dnt-query = { path = "crates/query" }
dnt-schema = { path = "crates/schema" }
dnt-store = { path = "crates/store" }
dnt-testkit = { path = "crates/testkit" }
dnt-tunnel = { path = "crates/tunnel" }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
# rustls (ring provider) only: no native-tls/OpenSSL, and aws-lc-rs would need cmake/NASM on Windows.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
quick-xml = "0.37"
rusqlite = { version = "0.40", features = ["bundled"] }
# Pure-Rust crypto via ring (no OpenSSL; aws-lc-rs would need cmake/NASM on Windows).
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
rusqlite_migration = "2.6"
# Excel export; constant memory: rows stream to a temp file instead of RAM.
rust_xlsxwriter = { version = "=0.100.0", default-features = false, features = ["constant_memory"] }
# Only used to recognise rustls handshake errors that tokio-rustls wraps in io::Error.
rustls = { version = "0.23", default-features = false }
secrecy = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# rustls (ring provider) only, like mysql_async above.
tokio-postgres-rustls = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["derive", "uuid"] }
# Must match tauri-specta (=2.0.0-rc.21 is built against specta =2.0.0-rc.22).
specta-typescript = "=0.0.9"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# WebView2 settings Tauri does not expose (browser accelerator keys); versions match wry's.
webview2-com = "0.39"
windows-core = "0.62"
zeroize = "1"

# Argon2id (m = 64 MiB) is very slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
