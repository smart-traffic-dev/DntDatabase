name: dnt-test

# Integration-test matrix. Start with:
#   docker compose -f testdata/docker-compose.test.yml up -d --wait
# Run `cargo run -p dnt-testkit --features gen-fixtures --bin gen_fixtures` first (certs, ssh
# keys and the Mongo keyfile are mounted from here).
#
# MongoDB (crates/driver-mongo), users root/dnt_test and dnt/dnt_test (readWrite on dnt_fixture):
#   mongo60  mongo:6.0, standalone with auth, host port 27060.
#   mongo80  mongo:8.0, single-node replica set rs0 (member 127.0.0.1:27080, published 1:1),
#            keyFile internal auth, TLS allowed but not required (testdata/certs; client
#            certificates verified against ca.pem when presented), host port 27080.
# Both run with `enableTestCommands=1` (test only: the failCommand failpoint). The healthcheck
# initialises them once (testdata/mongo/*.js) and seeds dnt_fixture.orders + view paid_orders.
# Start only these with: docker compose -f testdata/docker-compose.test.yml up -d --wait mongo60 mongo80

x-mysql-args: &mysql-args
  - --ssl-ca=/certs/ca.pem
  - --ssl-cert=/certs/server.pem
  - --ssl-key=/certs/server-key.pem
  - --character-set-server=utf8mb4
  - --collation-server=utf8mb4_unicode_ci

x-mysql-health: &mysql-health
  test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -pdnt_test --silent"]
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 20s

x-mariadb-health: &mariadb-health
  test: ["CMD-SHELL", "mariadb-admin ping -h127.0.0.1 -uroot -pdnt_test --silent"]
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 20s

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dnt_fixture"]
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 20s

# PostgreSQL refuses a key file that is not 0600 and owned by the server user, which a Windows
# bind mount can never satisfy. The wrapper copies the certs inside the container first.
x-pg-command: &pg-command
  - bash
  - -c
  - >-
    mkdir -p /etc/dnt-ssl &&
    cp /certs/ca.pem /certs/server.pem /certs/server-key.pem /etc/dnt-ssl/ &&
    chown postgres:postgres /etc/dnt-ssl/* &&
    chmod 600 /etc/dnt-ssl/server-key.pem &&
    exec docker-entrypoint.sh postgres
    -c ssl=on
    -c ssl_ca_file=/etc/dnt-ssl/ca.pem
    -c ssl_cert_file=/etc/dnt-ssl/server.pem
    -c ssl_key_file=/etc/dnt-ssl/server-key.pem

# Initialises (once) and seeds a MongoDB service; healthy once the `paid_orders` view exists.
# Needs DNT_PORT (and DNT_REPLSET for a replica set) in the service environment.
x-mongo-health: &mongo-health
  test:
    - CMD-SHELL
    - >-
      as_root="--port $$DNT_PORT -u root -p dnt_test --authenticationDatabase admin";
      mongosh --quiet $$as_root --eval 'quit(db.getSiblingDB("dnt_fixture").getCollectionInfos({name: "paid_orders"}).length ? 0 : 1)' >/dev/null 2>&1 && exit 0;
      mongosh --quiet --port $$DNT_PORT --file /dnt-mongo/bootstrap.js >/dev/null 2>&1;
      mongosh --quiet $$as_root --file /dnt-mongo/prepare.js &&
      mongoimport --quiet $$as_root --db dnt_fixture --collection orders --jsonArray --file /dnt-mongo/orders.json &&
      mongosh --quiet $$as_root --file /dnt-mongo/finish.js
  interval: 5s
  timeout: 90s
  retries: 40
  start_period: 30s

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: dnt_test
  POSTGRES_DB: dnt_fixture

services:
  mysql57:
    image: mysql:5.7
    platform: linux/amd64
    command: *mysql-args
    environment:
      MYSQL_ROOT_PASSWORD: dnt_test
      MYSQL_DATABASE: dnt_fixture
    ports: ["33057:3306"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/mysql_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
      - ./sql/zero_dates.sql:/docker-entrypoint-initdb.d/02_zero_dates.sql:ro
    healthcheck: *mysql-health

  mysql8:
    image: mysql:8.0
    command: *mysql-args
    environment:
      MYSQL_ROOT_PASSWORD: dnt_test
      MYSQL_DATABASE: dnt_fixture
    ports: ["33080:3306"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/mysql_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
      - ./sql/mysql8.sql:/docker-entrypoint-initdb.d/02_mysql8.sql:ro
    healthcheck: *mysql-health

  # Explain fixtures only (crates/query/tests/explain_capture.rs); not in the default matrix.
  # Start with: docker compose -f testdata/docker-compose.test.yml --profile explain up -d --wait mysql84
  mysql84:
    image: mysql:8.4
    profiles: ["explain"]
    command: *mysql-args
    environment:
      MYSQL_ROOT_PASSWORD: dnt_test
      MYSQL_DATABASE: dnt_fixture
    ports: ["33084:3306"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/mysql_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
      - ./sql/mysql8.sql:/docker-entrypoint-initdb.d/02_mysql8.sql:ro
    healthcheck: *mysql-health

  mariadb106:
    image: mariadb:10.6
    command: *mysql-args
    environment:
      MARIADB_ROOT_PASSWORD: dnt_test
      MARIADB_DATABASE: dnt_fixture
    ports: ["33106:3306"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/mysql_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
      - ./sql/mariadb.sql:/docker-entrypoint-initdb.d/02_mariadb.sql:ro
      - ./sql/zero_dates.sql:/docker-entrypoint-initdb.d/03_zero_dates.sql:ro
    healthcheck: *mariadb-health

  mariadb114:
    image: mariadb:11.4
    command: *mysql-args
    environment:
      MARIADB_ROOT_PASSWORD: dnt_test
      MARIADB_DATABASE: dnt_fixture
    ports: ["33114:3306"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/mysql_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
      - ./sql/mariadb.sql:/docker-entrypoint-initdb.d/02_mariadb.sql:ro
      - ./sql/zero_dates.sql:/docker-entrypoint-initdb.d/03_zero_dates.sql:ro
    healthcheck: *mariadb-health

  pg12:
    image: postgres:12
    command: *pg-command
    environment: *pg-env
    ports: ["54312:5432"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/pg_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
    healthcheck: *pg-health

  pg17:
    image: postgres:17
    command: *pg-command
    environment: *pg-env
    ports: ["54317:5432"]
    volumes:
      - ./certs:/certs:ro
      - ./sql/pg_common.sql:/docker-entrypoint-initdb.d/01_common.sql:ro
    healthcheck: *pg-health

  mongo60:
    image: mongo:6.0
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --setParameter
      - enableTestCommands=1
    environment:
      DNT_PORT: "27017"
    ports: ["27060:27017"]
    volumes:
      - ./mongo:/dnt-mongo:ro
    healthcheck: *mongo-health

  # mongod refuses a keyfile that is not 0400/0600 and owned by its user, which a Windows bind
  # mount can never satisfy; the wrapper copies it (and builds the server's one-file PEM) first.
  mongo80:
    image: mongo:8.0
    command:
      - bash
      - -c
      - >-
        mkdir -p /etc/dnt-mongo &&
        cp /dnt-mongo/keyfile /certs/ca.pem /etc/dnt-mongo/ &&
        { cat /certs/server.pem; echo; cat /certs/server-key.pem; } > /etc/dnt-mongo/server-combined.pem &&
        chown -R mongodb:mongodb /etc/dnt-mongo &&
        chmod 400 /etc/dnt-mongo/keyfile &&
        exec docker-entrypoint.sh mongod
        --port 27080
        --bind_ip_all
        --replSet rs0
        --keyFile /etc/dnt-mongo/keyfile
        --tlsMode allowTLS
        --tlsCertificateKeyFile /etc/dnt-mongo/server-combined.pem
        --tlsCAFile /etc/dnt-mongo/ca.pem
        --tlsAllowConnectionsWithoutCertificates
        --setParameter enableTestCommands=1
    environment:
      DNT_PORT: "27080"
      DNT_REPLSET: rs0
    ports: ["27080:27080"]
    volumes:
      - ./certs:/certs:ro
      - ./mongo:/dnt-mongo:ro
    healthcheck: *mongo-health

  ssh:
    image: lscr.io/linuxserver/openssh-server
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      PASSWORD_ACCESS: "true"
      USER_NAME: dnt
      USER_PASSWORD: dnt_test
      PUBLIC_KEY_DIR: /keys
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
    ports: ["2222:2222"]
    volumes:
      - ./ssh/id_ed25519.pub:/keys/id_ed25519.pub:ro
      - ./ssh/id_ed25519_enc.pub:/keys/id_ed25519_enc.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2222"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
