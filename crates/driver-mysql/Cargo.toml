[package]
name = "dnt-driver-mysql"
version.workspace = true
edition.workspace = true

[lib]
name = "dnt_driver_mysql"

[features]
# Exposes `MySqlSession::query_row_text` for integration tests only (it bypasses
# transaction tracking, so it is not part of the normal API).
test-helpers = []

[dependencies]
async-trait.workspace = true
dnt-core.workspace = true
mysql_async.workspace = true
rustls.workspace = true
secrecy.workspace = true
tokio = { workspace = true, features = ["macros"] }

[dev-dependencies]
dnt-driver-mysql = { path = ".", features = ["test-helpers"] }
dnt-testkit = { path = "../testkit" }
insta = { version = "1", features = ["yaml", "redactions"] }
serde.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
