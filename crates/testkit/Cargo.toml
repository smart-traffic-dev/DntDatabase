[package]
name = "dnt-testkit"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "dnt_testkit"

[features]
# Fixture generator only; keeps rcgen/ssh-key out of consumers' dev builds.
gen-fixtures = ["dep:rcgen", "dep:ssh-key"]

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"
required-features = ["gen-fixtures"]

# Fills the dev build's connection list with the Docker test matrix (see the file's header).
[[bin]]
name = "seed_dev"
path = "src/bin/seed_dev.rs"

[dependencies]
async-trait.workspace = true
dirs.workspace = true
dnt-core.workspace = true
dnt-store.workspace = true
secrecy.workspace = true
# `Notify` for the fake Command driver's blocked-command hook.
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
rcgen = { version = "0.13", optional = true }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"], optional = true }
