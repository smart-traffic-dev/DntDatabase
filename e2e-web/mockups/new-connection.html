<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New connection — mockup</title>
    <link rel="stylesheet" href="../../ui/src/theme/tokens.css" />
    <style>
      :root {
        --dlg-line: var(--studio-hairline);
        --muted: var(--studio-fg-secondary);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f3f3;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.28);
      }
      body.dark {
        background: #1b1b1b;
        color-scheme: dark;
      }
      body.dark::before {
        background: rgba(0, 0, 0, 0.45);
      }

      .modal {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 840px;
        overflow: hidden;
        background: var(--studio-popover);
        border: 1px solid var(--dlg-line);
        border-radius: var(--radius-md);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 18px 14px;
        border-bottom: 1px solid var(--dlg-line);
      }
      .head h1 {
        margin: 0;
        font-size: var(--text-headline);
        line-height: var(--text-headline--line-height);
        font-weight: 600;
        color: var(--studio-fg);
      }
      .head p {
        margin: 2px 0 0;
        font-size: var(--text-footnote);
        line-height: var(--text-footnote--line-height);
        color: var(--muted);
      }
      .close {
        margin-left: auto;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: none;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
      }

      .body {
        display: flex;
        align-items: stretch;
      }

      .rail {
        flex: none;
        width: 214px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 12px 16px;
        background: var(--studio-sidebar);
        border-right: 1px solid var(--dlg-line);
      }
      .rail-title {
        margin: 0 0 6px;
        padding: 0 8px;
        font-size: var(--text-caption);
        line-height: var(--text-caption--line-height);
        font-weight: 500;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .engine {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
      }
      .engine .ico {
        display: flex;
        color: var(--muted);
      }
      .engine b {
        display: block;
        font-size: var(--text-callout);
        line-height: var(--text-callout--line-height);
        font-weight: 500;
        color: var(--studio-fg);
      }
      .engine small {
        display: block;
        font-size: var(--text-caption);
        line-height: var(--text-caption--line-height);
        color: var(--muted);
      }
      .engine .radio {
        flex: none;
        width: 14px;
        height: 14px;
        margin-left: auto;
        border: 1px solid var(--studio-fg-tertiary);
        border-radius: 50%;
      }
      .engine.on {
        background: var(--studio-control);
        border-color: var(--dlg-line);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .engine.on .radio {
        border-color: var(--studio-fg);
        background: radial-gradient(circle, var(--studio-fg) 0 3.2px, transparent 3.7px);
      }
      .rail-note {
        margin: auto 0 0;
        padding: 12px 8px 0;
        border-top: 1px solid var(--dlg-line);
        font-size: var(--text-caption);
        line-height: var(--text-caption--line-height);
        color: var(--muted);
      }

      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .tabs {
        flex: none;
        display: flex;
        gap: 4px;
        padding: 0 18px;
        border-bottom: 1px solid var(--dlg-line);
      }
      .tab {
        position: relative;
        padding: 11px 9px;
        border: 0;
        background: none;
        font-size: var(--text-callout);
        line-height: var(--text-callout--line-height);
        color: var(--muted);
      }
      .tab.on {
        color: var(--studio-fg);
        font-weight: 600;
      }
      .tab.on::after {
        content: '';
        position: absolute;
        left: 7px;
        right: 7px;
        bottom: -1px;
        height: 2px;
        border-radius: 2px;
        background: var(--studio-fg);
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 16px 18px 18px;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sec-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: var(--text-caption);
        line-height: var(--text-caption--line-height);
        font-weight: 500;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sec-title::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--dlg-line);
      }
      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .field > label {
        font-size: var(--text-footnote);
        line-height: var(--text-footnote--line-height);
        color: var(--muted);
      }
      .field input,
      .field select {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--dlg-line);
        border-radius: var(--radius-sm);
        background: var(--studio-control);
        font: inherit;
        font-size: var(--text-callout);
        color: var(--studio-fg);
      }
      .field select {
        padding-right: 6px;
      }
      .hostrow {
        display: grid;
        grid-template-columns: 1fr 110px;
        gap: 14px;
      }
      .pw {
        position: relative;
      }
      .pw input {
        padding-right: 54px;
      }
      .pw button {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        padding: 2px 4px;
        border: 0;
        border-radius: 6px;
        background: none;
        font: inherit;
        font-size: var(--text-footnote);
        color: var(--muted);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--text-callout);
        line-height: var(--text-callout--line-height);
        color: var(--studio-fg);
      }
      .check input {
        flex: none;
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--studio-fg);
      }
      .hint {
        margin: 0;
        font-size: var(--text-footnote);
        line-height: var(--text-footnote--line-height);
        color: var(--muted);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 18px 12px;
        font-size: var(--text-footnote);
        line-height: var(--text-footnote--line-height);
        color: var(--muted);
      }
      .status .dot {
        width: 8px;
        height: 8px;
        border: 1px solid var(--studio-fg-tertiary);
        border-radius: 50%;
      }
      .status .checkmark {
        color: var(--studio-fg);
        font-weight: 700;
      }

      .foot {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid var(--dlg-line);
      }
      .spacer {
        flex: 1;
      }
      .btn {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--dlg-line);
        border-radius: var(--radius-sm);
        background: var(--studio-control);
        font: inherit;
        font-size: var(--text-callout);
        color: var(--studio-fg);
      }
      .btn.primary {
        border-color: var(--studio-accent);
        background: var(--studio-accent);
        color: var(--studio-accent-fg);
        font-weight: 600;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mock-title">
      <header class="head">
        <div>
          <h1 id="mock-title">New connection</h1>
          <p>Connect to a MySQL, MariaDB or PostgreSQL server.</p>
        </div>
        <button class="close" aria-label="Close">×</button>
      </header>

      <div class="body">
        <aside class="rail">
          <p class="rail-title">Engine</p>
          <div class="engine">
            <span class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v14c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5"/></svg>
            </span>
            <span><b>MySQL</b><small>5.7 and 8.x</small></span>
            <span class="radio"></span>
          </div>
          <div class="engine">
            <span class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v14c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5"/></svg>
            </span>
            <span><b>MariaDB</b><small>10.x and 11.x</small></span>
            <span class="radio"></span>
          </div>
          <div class="engine on">
            <span class="ico">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v14c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5"/></svg>
            </span>
            <span><b>PostgreSQL</b><small>13 and later</small></span>
            <span class="radio"></span>
          </div>
          <p class="rail-note">SSH and SSL settings live on their own tabs.</p>
        </aside>

        <section class="main">
          <div class="tabs" role="tablist">
            <button class="tab on" role="tab" aria-selected="true">General</button>
            <button class="tab" role="tab" aria-selected="false">SSH</button>
            <button class="tab" role="tab" aria-selected="false">SSL</button>
            <button class="tab" role="tab" aria-selected="false">Advanced</button>
          </div>

          <div class="content">
            <div class="sec">
              <h2 class="sec-title">Connection</h2>
              <div class="fields">
                <div class="field">
                  <label for="m-name">Name</label>
                  <input id="m-name" value="Shop analytics" />
                </div>
                <div class="field">
                  <label for="m-group">Group</label>
                  <select id="m-group"><option>No group</option><option selected>Staging</option></select>
                </div>
              </div>
            </div>

            <div class="sec">
              <h2 class="sec-title">Server</h2>
              <div class="hostrow">
                <div class="field">
                  <label for="m-host">Host</label>
                  <input id="m-host" value="db.internal" />
                </div>
                <div class="field">
                  <label for="m-port">Port</label>
                  <input id="m-port" value="5432" />
                </div>
              </div>
              <div class="fields">
                <div class="field">
                  <label for="m-user">User</label>
                  <input id="m-user" value="analytics" />
                </div>
                <div class="field">
                  <label for="m-password">Password</label>
                  <div class="pw">
                    <input id="m-password" type="password" value="hunter2hunter2" />
                    <button type="button">Show</button>
                  </div>
                </div>
              </div>
              <label class="check"><input type="checkbox" checked /> Save password in Windows Credential Manager</label>
            </div>

            <div class="sec">
              <h2 class="sec-title">Options</h2>
              <div class="fields">
                <div class="field">
                  <label for="m-db">Default database</label>
                  <input id="m-db" value="shop" />
                </div>
                <div class="field">
                  <label for="m-env">Environment tag</label>
                  <select id="m-env"><option>None</option><option selected>Staging</option><option>Production</option><option>Local</option></select>
                </div>
              </div>
              <label class="check"><input type="checkbox" /> Read-only connection</label>
            </div>
          </div>

          <div class="status">
            <span class="dot"></span>
            Not tested yet
          </div>
        </section>
      </div>

      <footer class="foot">
        <button class="btn">Test</button>
        <span class="spacer"></span>
        <button class="btn">Cancel</button>
        <button class="btn primary">Save</button>
      </footer>
    </div>
  </body>
</html>
