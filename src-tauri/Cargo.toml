[package]
name = "dntdatabase"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "dntdatabase"

[[bin]]
name = "dntdatabase"
path = "src/main.rs"

[features]
# Plan internals for the integration tests (`take_plan` / `plan_statement`); never
# enabled in the app, so nothing can run a plan around `query_run`'s guard.
test-helpers = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# `JobRunner` (jobs) is an async trait object.
async-trait.workspace = true
dirs.workspace = true
dnt-core.workspace = true
dnt-driver-mysql.workspace = true
dnt-driver-pg.workspace = true
dnt-query.workspace = true
dnt-schema.workspace = true
dnt-store.workspace = true
dnt-transfer.workspace = true
dnt-tunnel.workspace = true
futures-util = { workspace = true, features = ["std"] }
rust_xlsxwriter.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# `serde_json`: `JobParams` carries each job kind's request as a JSON value.
specta = { workspace = true, features = ["serde_json"] }
specta-typescript.workspace = true
# `devtools`: `WebviewWindow::open_devtools` also exists in release builds (Tools > Developer tools).
tauri = { workspace = true, features = ["devtools"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
# In-app updates from the GitHub releases (commands/update.rs).
tauri-plugin-updater.workspace = true
tauri-specta.workspace = true
time.workspace = true
# `process` + `io-util`: the external tool runner (N7, backup/ext_tools.rs).
tokio = { workspace = true, features = ["rt", "process", "io-util"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
windows-core.workspace = true

[dev-dependencies]
async-trait.workspace = true
dnt-core = { workspace = true, features = ["test-util"] }
dnt-testkit.workspace = true
# The integration tests see the `test-helpers` API.
dntdatabase = { path = ".", features = ["test-helpers"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Reads back `.sql.gz` dumps in tests.
flate2.workspace = true
